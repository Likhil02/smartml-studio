services:
  - type: web
    name: smartml-studio-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEMO_MODE
        value: "true"
      - key: FRONTEND_URL
        sync: false          # set in dashboard: your Netlify URL, e.g. https://smartml-demo.netlify.app
      - key: TF_CPP_MIN_LOG_LEVEL
        value: "2"
